name: Android Build & Release PoC
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Download Xray binary
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v1.8.24/Xray-android-arm64-v8a.zip"
          unzip -o xray.zip xray -d app/src/main/assets/
          chmod +x app/src/main/assets/xray
          echo "Xray OK: $(wc -c < app/src/main/assets/xray) bytes"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GhostVPN-Tester-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          tag: "poc-v0.1"
          name: "GhostVPN Tester PoC v0.1"
          body: "Cellular routing via Xray-core + CellularSocksProxy"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}